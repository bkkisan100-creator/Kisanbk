name: Evening News Bulletin

on:
  schedule:
    - cron: "15 12 * * *"
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"
    - cron: "15 15 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:

jobs:
  hourly-news:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Aaja Ke Chha News
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Starting Aaja Ke Chha hourly news..."
          echo "Calling production API..."

          RESPONSE=$(curl -sS \
            -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://kisanbk-7ywr.vercel.app/api/cron/hourly-news")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | sed -n 's/HTTP_STATUS://p')

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Hourly news API failed."
            exit 1
          fi

          echo "Hourly news API completed successfully."